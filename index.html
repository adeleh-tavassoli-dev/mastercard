<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastercard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <span class="logo">
                <img src="./images/mastercard-26161.png" alt="logo">
                <h5>Mastercard</h5>
            </span>
            <img class="chip" src="./images/—Pngtree—close-up view of a golden_23691834.png" alt="chip">
        </header>

        <div class="card-details">
            <div class="name-number">
                <h6>Card Number</h6>
                <h5 class="number">8050 4596 3274 6030</h5>
                <h5 class="name">Henry Johnson</h5>
            </div>

            <div class="valid-date">
                <h6>Valid Thru</h6>
                <h5>08/30</h5>
            </div>
        </div>
    </div>
</body>
</html>
